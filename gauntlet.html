<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>brainrot SIGMA67 // gauntlet</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-99NBM52L6B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-99NBM52L6B');
  </script>

  <link rel="stylesheet" href="gauntlet.css?v=1" />
</head>

<body>
  <main class="game-shell">
    <section class="game-card">
      <header class="game-header">
        <a class="back-link" href="index.html">← HOME</a>

        <div class="title-wrap">
          <div class="eyebrow">SIGMA-67 TEMPLE SYSTEM</div>
          <h1>GAUNTLET <span>// 67</span></h1>
        </div>

        <button id="soundButton" class="sound-button" type="button" aria-pressed="true">
          MUSIC: ON
        </button>
      </header>

      <div class="screen-wrap">
        <canvas id="gauntletCanvas" aria-label="Retro pseudo-3D gauntlet game"></canvas>

        <div id="startOverlay" class="overlay">
          <div class="overlay-panel">
            <p class="tiny-label">TEMPLE SIGNAL ACQUIRED</p>
            <h2>RUN INTO THE VOID.</h2>
            <p>↑ / W = JUMP &nbsp;&nbsp; ↓ / S = DUCK &nbsp;&nbsp; TAP TOP/BOTTOM</p>
            <button id="startButton" class="primary-button" type="button">ENTER</button>
          </div>
        </div>

        <div id="gameOverOverlay" class="overlay hidden" aria-live="polite">
          <div class="overlay-panel">
            <p class="tiny-label">RITUAL INTERRUPTED</p>
            <h2>THE TEMPLE SAID NO.</h2>
            <p id="finalScore">DISTANCE: 0</p>
            <button id="restartButton" class="primary-button" type="button">AGAIN</button>
          </div>
        </div>

        <div class="scanlines" aria-hidden="true"></div>
      </div>

      <footer class="game-footer">
        <span>JUMP ↑ / W &nbsp;&nbsp; DUCK ↓ / S</span>
        <span id="statusText">READY</span>
        <span>BEST: <strong id="bestScore">0</strong></span>
      </footer>
    </section>
  </main>

  <script src="gauntlet.js?v=1"></script>
</body>
</html>
